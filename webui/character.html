<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色与图片 · MaiWeave</title>
<style>
*{box-sizing:border-box}body{max-width:1180px;margin:auto;padding:16px;font:14px/1.6 var(--maibot-font-body,system-ui);color:var(--maibot-foreground,#263c32);background:var(--maibot-background,#f6f4ed)}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}p{margin:6px 0;color:var(--maibot-muted,#68766d)}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.panel{border:1px solid var(--maibot-border,#d8dfd5);border-radius:10px;padding:15px;background:var(--maibot-surface,#fffef8);margin-top:12px}.character-reference{margin-top:12px}.checks,.upload-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.upload-row input[type=file]{width:220px;max-width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.reference{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}img{display:block;width:110px;height:130px;object-fit:contain;border-radius:7px;background:var(--maibot-background,#f6f4ed)}.empty{height:130px;display:grid;place-items:center;text-align:center;padding:12px;border:1px dashed var(--maibot-border,#cad5cc);border-radius:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{font:inherit;border:1px solid var(--maibot-border,#cad5cc);background:var(--maibot-surface,#fffef8);color:inherit;border-radius:6px;padding:7px 11px;cursor:pointer}.primary{background:#467965;color:#fff}.muted{font-size:12px}#status{white-space:pre-wrap}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}textarea,input[type=url]{width:100%;font:inherit;color:inherit;background:var(--maibot-background,#f6f4ed);border:1px solid var(--maibot-border,#d8dfd5);border-radius:6px;padding:8px}input[type=file]{width:100%;font:inherit;font-size:12px}textarea{resize:vertical;min-height:72px}label.field{display:block;margin:8px 0 4px;font-weight:600}.check{display:block;margin:7px 0}.check input{margin-right:7px}.footer{display:flex;align-items:center;gap:12px;position:sticky;bottom:0;padding:10px 0;background:var(--maibot-background,#f6f4ed)}details{margin-top:10px}summary{cursor:pointer;font-weight:600}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-head h2{margin:0}#draft-status:empty,#status:empty,#url:empty{display:none}@media(max-width:760px){.section-head{align-items:start;flex-wrap:wrap}.grid{grid-template-columns:1fr}header{align-items:start}.footer{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>角色与图片</h1><p>设定麦麦的样子，也选一选生活的画风。</p></div><button id="back">← 此刻生活</button></header>
<section class="panel"><div class="section-head"><h2>麦麦的样子与参考图</h2><button id="generate">根据 MaiBot 人设生成角色卡</button></div><div class="reference character-reference"><div><img id="preview" alt="当前角色参考图" hidden><div class="empty" id="empty">上传一张角色图</div></div><div><div class="checks"><label class="check"><input id="image_character_enabled" type="checkbox">启用麦麦角色卡</label><label class="check"><input id="image_character_reference_enabled" type="checkbox">人物入镜时使用参考图</label></div><p id="state"></p><p class="muted">外貌以参考图为主，文字补充细节，穿着随活动调整。空间和聊天共用。</p><div class="upload-row"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button class="primary" id="upload">上传 / 替换</button><button id="remove">移除上传图片</button></div><p class="muted">支持 PNG、JPEG、WebP，保存当前一张。<span id="service"></span></p></div></div><details><summary>使用图片直链</summary><label class="field" for="image_character_reference_url">参考图片地址（选填）</label><input id="image_character_reference_url" type="url" maxlength="2000" placeholder="https://…"><p class="muted">已上传的图片优先使用。移除上传图片后改用直链。</p><p id="url" class="muted"></p></details><p id="draft-status" role="status"></p><div class="grid"><div><label class="field" for="image_character_appearance">外貌设定（选填）</label><textarea id="image_character_appearance" maxlength="800" rows="3" placeholder="发型、发色、眼睛等稳定特征"></textarea></div><div><label class="field" for="image_character_clothing">常用穿着（选填）</label><textarea id="image_character_clothing" maxlength="400" rows="3" placeholder="常穿的衣服和搭配偏好"></textarea></div></div></section>
<section class="panel"><div class="section-head"><h2>画面风格</h2><button id="preset">使用暖光日常插画</button></div><p class="muted">预设同时填入两种风格和负面提示词，保存后生效。自拍偏近景互动，拍物件偏第一人称；场景和光线随生活内容变化。</p><div class="grid"><div><label class="field" for="image_style">空间随笔与测试风格（选填）</label><textarea id="image_style" maxlength="800" rows="5"></textarea></div><div><label class="field" for="chat_image_style">聊天图片风格（选填）</label><textarea id="chat_image_style" maxlength="800" rows="5"></textarea></div></div><details><summary>共用负面提示词</summary><label class="field" for="image_negative_prompt">希望避免的画面效果（选填）</label><textarea id="image_negative_prompt" maxlength="800" rows="3"></textarea></details><p class="muted">同一段经历已有的图片继续复用；新风格用于后续生成。</p></section>
<div class="footer"><button id="save" class="primary">保存设置</button><p id="status" role="status"></p></div>
<script type="module">
const $=id=>document.getElementById(id);
let stylePreset;
const fields=['image_character_enabled','image_character_reference_enabled','image_character_reference_url','image_character_appearance','image_character_clothing','image_style','chat_image_style','image_negative_prompt'];
async function refresh(fill=false){const data=await maibot.query('data');stylePreset=data.style_preset;$('preview').hidden=!data.uploaded;$('empty').hidden=data.uploaded;if(data.preview)$('preview').src=data.preview;else $('preview').removeAttribute('src');$('remove').disabled=!data.uploaded;$('state').textContent=data.enabled?'角色参考图已开启':'角色参考图未开启，可在下方开启并保存';$('service').textContent=data.protocol+' · '+data.model;$('url').textContent=data.url?(data.uploaded?'已上传图片优先使用，另存的直链：':'当前使用配置中的图片直链：')+data.url:'';if(fill)for(const key of fields){const input=$(key);if(input.type==='checkbox')input.checked=data.settings[key];else input.value=data.settings[key];}return data;}
async function run(fn){$('upload').disabled=true;$('remove').disabled=true;try{$('status').textContent='正在处理…';const result=await fn();await refresh();$('status').textContent=result.message;}catch(e){$('status').textContent=e.message;}finally{$('upload').disabled=false;$('remove').disabled=$('preview').hidden;}}
$('back').onclick=()=>maibot.navigate('overview');
$('upload').onclick=()=>run(async()=>{const file=$('file').files[0];if(!file)throw Error('请先选择参考图片');const image=await createImageBitmap(file);const scale=Math.min(1,1024/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);image.close();let content=canvas.toDataURL('image/jpeg',.88).split(',')[1];if(content.length>700000)content=canvas.toDataURL('image/jpeg',.65).split(',')[1];if(content.length>700000)throw Error('图片较大，请选择更小的参考图');await maibot.action('manage',{action:'begin'});try{for(let offset=0;offset<content.length;offset+=32768){await maibot.action('manage',{action:'append',content:content.slice(offset,offset+32768)});$('status').textContent='正在上传 '+Math.min(100,Math.round((offset+32768)/content.length*100))+'%';await new Promise(resolve=>setTimeout(resolve,100));}const result=await maibot.action('manage',{action:'finish'});$('file').value='';return result;}catch(error){await maibot.action('manage',{action:'abort'});throw error;}});
$('remove').onclick=()=>run(()=>maibot.action('manage',{action:'remove'}));
$('preset').onclick=()=>{for(const [key,value] of Object.entries(stylePreset))$(key).value=value;$('status').textContent='已填入暖光日常插画，点击保存后生效。';};
$('save').onclick=async()=>{const values={};for(const key of fields)values[key]=$(key).type==='checkbox'?$(key).checked:$(key).value;$('save').disabled=true;try{const result=await maibot.action('save',{content:JSON.stringify(values)});await refresh();$('status').textContent=result.message;}catch(e){$('status').textContent=e.message;}finally{$('save').disabled=false;}};
async function watchDraft(){const data=await maibot.query('data');$('draft-status').textContent=data.draft_message;$('generate').disabled=data.generating;if(data.generating){setTimeout(()=>watchDraft().catch(e=>{$('draft-status').textContent=e.message;$('generate').disabled=false;}),1500);}else if(data.draft){$('image_character_appearance').value=data.draft.appearance;$('image_character_clothing').value=data.draft.clothing;}}
$('generate').onclick=async()=>{$('generate').disabled=true;$('draft-status').textContent='正在根据 MaiBot 人设生成…';try{await maibot.action('generate');await watchDraft();}catch(e){$('draft-status').textContent=e.message;$('generate').disabled=false;}};
await maibot.ready;try{const initial=await refresh(true);if(initial.generating)await watchDraft();}catch(e){$('status').textContent=e.message;}
</script></body></html>
